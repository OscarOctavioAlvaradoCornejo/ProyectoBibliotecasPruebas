<!DOCTYPE html>
<html>
    <head>
        <title>Búsqueda de Libros</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="styles/grupoStyles.css" rel="stylesheet">       
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    </head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Biblioteca Digital</a>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item text-white"><a class="nav-link text-white" href="index.html">Inicio</a></li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="container mt-4">
            <h1 class="text-center text-primary">Búsqueda de Libros</h1>

            <!-- Campo de búsqueda -->
            <input type="text" id="searchInput" placeholder="Buscar libros..." oninput="filtrarLibros()" />

            <h2>Lista de Libros</h2>
            <table border="1">
                <thead>
                    <tr>
                        <th>Nombre del Libro</th>
                        <th>Autor</th>
                        <th>Categoría</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="librosTableBody">
                    <!-- Aquí se cargarán los libros desde la API -->
                </tbody>
            </table>
        </div>


        <!-- Modal para mostrar el PDF -->
        <div class="modal fade" id="pdfModal" tabindex="-1" aria-labelledby="pdfModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="pdfModalLabel">Ver PDF</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <embed id="pdfEmbed" src="" width="100%" height="500px" type="application/pdf">
                    </div>
                </div>
            </div>
        </div>

        <footer class="bg-dark text-white text-center py-3 mt-4">
            <p>Biblioteca Digital &copy; 2024</p>
        </footer>

        <script src="js/admin_alumnos.js"></script>


    </body>
</html>
