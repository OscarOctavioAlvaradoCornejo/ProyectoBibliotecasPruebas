<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Libros</title>
        <link href="styles/grupoStyles.css" rel="stylesheet">       
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    </head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Biblioteca Digital</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item text-white"><a class="nav-link text-white" href="index.html">Inicio</a></li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="container mt-4">
            <h1 class="text-center text-primary">Administración de Libros</h1>

            <!-- Formulario para agregar libros -->
            <section>
                <h2>Agregar Libro</h2>
                <form id="formLibro">
                    <input type="hidden" id="idLibro" value="" />

                    <label for="nombreLibro">Nombre del Libro:</label>
                    <input type="text" id="nombreLibro" name="nombreLibro" required><br>

                    <label for="autor">Autor:</label>
                    <input type="text" id="autor" name="autor" required><br>

                    <label for="genero">Género:</label>
                    <input type="text" id="genero" name="genero" required><br>

                    <label for="archivo">Subir archivo:</label>
                    <input type="file" id="archivo" name="archivo" required><br>

                    <button type="button" onclick="insertarLibro()">Agregar Libro</button>
                    <button type="button" onclick="actualizarLibro()">Actualizar Libro</button>
                </form>

                <h2>Lista de Libros</h2>
                <table border="1">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Autor</th>
                            <th>Género</th>
                            <th>Acciones</th>
                            <th>Ver PDF</th>
                        </tr>
                    </thead>
                    <tbody id="librosTableBody">
                        <!-- Aquí se cargarán los libros desde la API -->
                    </tbody>
                </table>
            </section>
        </div>

        <!-- Modal para mostrar el PDF -->
        <div class="modal fade" id="pdfModal" tabindex="-1" aria-labelledby="pdfModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="pdfModalLabel">Ver PDF</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <embed id="pdfEmbed" src="" width="100%" height="500px" type="application/pdf">
                        <embed id="pdfViewer" src="" type="application/pdf" width="100%" height="600px" style="display: none;">
                    </div>
                </div>
            </div>
        </div>

        <footer class="bg-dark text-white text-center py-3 mt-4">
            <p>Biblioteca Digital &copy; 2024</p>
        </footer>

        <script src="js/admin_libros.js"></script>
    </body>
</html>
