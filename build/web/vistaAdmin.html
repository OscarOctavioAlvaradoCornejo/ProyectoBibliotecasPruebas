<!DOCTYPE html>

<html>
    <head>
        <title>Biblioteca Digital</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="styles/grupoStyles.css" rel="stylesheet">       
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    </head>
    <body>

        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Vista administrador</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item text-white"><a class="nav-link text-white" href="index.html">Inicio</a></li>

                    </ul>
                </div>
            </div>
        </nav>

        <div class="container mt-4">
            <h1 class="text-center text-primary">Administración de Usuarios</h1>

            <!-- Formulario para agregar libros -->
            <section>
                <h2>Agregar Usuario</h2>
                <form id="formLibro">
                    <input type="hidden" id="idUsuario" value="" />

                    <label for="username">Ingrese el usuario:</label>
                    <input type="text" id="username" name="username" required><br>

                    <label for="pass">Ingrese la contraseña:</label>
                    <input type="text" id="pass" name="pass" required><br>

                    <label for="tipo">Seleccione el tipo de usuario</label>
                    <select id="tipo" name="tipo" required>
                        <option value="#" disabled>Seleccione un tipo</option>    
                        <option value="1">Administrador</option>
                        <option value="2">Bibliotecario</option>
                        <option value="3">Alumno</option>
                    </select>



                    <button type="button" onclick="insertarUsuario()">Agregar Usuario</button>
                </form>

                <h2>Lista de Usuarios</h2>
                <table border="1">
                    <thead>
                        <tr>
                            <th>Usuario</th>
                            <th>Estatus</th>
                            <th>Tipo</th>
                        </tr>
                    </thead>
                    <tbody id="usuariosTableBody">
                        <!-- Aquí se cargarán los libros desde la API -->
                    </tbody>
                </table>
            </section>
        </div>


        <footer class="bg-dark text-white text-center py-3 mt-4">
            <p>Biblioteca Digital &copy; 2024</p>
        </footer>
        <script src="js/admin_admin.js"></script>
    </body>
</html>
